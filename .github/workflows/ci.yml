name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Code style and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer cs:check
      - run: composer analyse
      - run: composer audit

  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.os }}, ${{ matrix.deps }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.2', '8.3', '8.4']
        deps: [highest]
        include:
          - os: ubuntu-latest
            php: '8.2'
            deps: lowest
          - os: windows-latest
            php: '8.2'
            deps: highest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install dependencies
        shell: bash
        run: |
          composer config --unset platform.php
          if [ "${{ matrix.deps }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            composer update --no-interaction --no-progress
          fi
      - run: composer test

  databases:
    name: Integration (MySQL 8, PostgreSQL 16, Redis 7)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: veyrophp_test
          MYSQL_ROOT_PASSWORD: secret
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -psecret" --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: veyrophp_test
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: --health-cmd="pg_isready" --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      VEYROPHP_TEST_MYSQL_HOST: 127.0.0.1
      VEYROPHP_TEST_MYSQL_DATABASE: veyrophp_test
      VEYROPHP_TEST_MYSQL_USERNAME: root
      VEYROPHP_TEST_MYSQL_PASSWORD: secret
      VEYROPHP_TEST_PGSQL_HOST: 127.0.0.1
      VEYROPHP_TEST_PGSQL_DATABASE: veyrophp_test
      VEYROPHP_TEST_PGSQL_USERNAME: postgres
      VEYROPHP_TEST_PGSQL_PASSWORD: secret
      VEYROPHP_TEST_REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite, redis
          coverage: none
      - run: composer install --no-interaction --no-progress
      # Every MySql*, Postgres* and Redis* integration class (database, ORM, password-reset
      # concurrency, queue, Redis store and connector), not only the first three written.
      - run: vendor/bin/phpunit --testsuite Integration --filter '(MySql|Postgres|Redis)[A-Za-z]*Test' --fail-on-skipped
